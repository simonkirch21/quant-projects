[project]
name = "accounting-red-flags"
version = "1.0.0"
description = "Signaux d'alerte comptables : Beneish, Altman, accruals, analyse de texte (Loughran-McDonald, Claude)"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pdfplumber", "plotly", "requests"]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
